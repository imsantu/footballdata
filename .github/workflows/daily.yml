name: 每日数据更新

# 用 GitHub Actions 取代本机 launchd：每天在云端抓取 2026-27 最新赛果、重建三份报告、
# 抽取数据同步进站点，并回推仓库（GitHub Pages 随即重新部署）。
on:
  schedule:
    # 北京 06:00 ≈ UTC 22:00（前一日）。共享 runner 可能延迟 15~30 分钟，属正常。
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 允许手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write        # 回推仓库必需；默认 token 只读会 403

concurrency:
  group: football-data-daily
  cancel-in-progress: false   # 不中断正在跑的每日更新

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 定时任务含脚本内 0~60 分钟随机错峰等待 + 抓取/构建；手动触发无等待，更快完成
    # 统一时区（整条 job 生效）。之前只有 refresh.sh 那一步设了 TZ，小程序三步没有 →
    # export_data.js 的 dataVersion / updatedAt 按 UTC 生成：北京 06:00 跑出来是
    # 前一天 22:00，客户端按日期显示就成了「1 天前」，看着像数据没更新。
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 git 身份（供回推提交）
        run: |
          git config user.email "bot@footballdata.local"
          git config user.name "Football Data Bot"

      - name: 运行每日更新（refresh.sh 内含抓数→重建→体检→提交→推送）
        env:
          FD_SITE_DIR: ${{ github.workspace }}
          FD_GENERATOR_DIR: ${{ github.workspace }}/generator
          FD_PY: python3
          TZ: Asia/Shanghai
          # 仅「定时(cron)」触发时 refresh.sh 才做随机错峰等待；手动 Run workflow 立即跑
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash tools/refresh.sh

      # ── 小程序数据包（供云函数每日拉取）────────────────────────────────
      # ⚠️ 这里**不再直接写云数据库**（2026-09-26 改）。写库改由小程序侧的 syncDaily
      # 云函数完成 —— 云函数用环境内置身份（cloud.DYNAMIC_CURRENT_ENV），不需要任何密钥。
      #
      # 改成这条链路的原因：原先「Actions 用腾讯云密钥直连写库」会间歇性报
      # [100003] Env Not Exists（实测同一份配置相隔 18 分钟、同一条手动路径一败一成，
      # 属服务端抖动，不是配置问题，无法根治）。拆成两段后各司其职：
      #   本工作流：抓数 → 算好统计 → 打包成一个 JSON → 提交（Pages 随后自动部署）
      #   云函数  ：每天下载这个 JSON → 写进云数据库
      # 统计计算仍只在这里做一次，小程序与 web 端数据逐字段一致。
      - name: 生成移动端数据（读取本站最新数据）
        working-directory: tools/mobile
        run: node gen_app_data.js

      - name: 导出并打包小程序数据包
        working-directory: tools/mobile
        env:
          DEV_OPENIDS: ${{ secrets.DEV_OPENIDS }}
        run: |
          node export_data.js
          node build_bundle.js

      - name: 提交小程序数据包（云函数从此拉取）
        run: |
          set -uo pipefail
          git config user.email "bot@footballdata.local"
          git config user.name "Football Data Bot"
          git add assets/js/data/mobile/app-data.json
          if git diff --cached --quiet; then
            echo "小程序数据包无变化，跳过提交"
          else
            git commit -q -m "chore(mobile): 更新小程序数据包 app-data.json"
            git pull --rebase origin main
            git push origin HEAD
            echo "::notice title=小程序数据包已更新::$(git log -1 --format='%h')"
          fi
