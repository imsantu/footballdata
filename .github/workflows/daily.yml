name: 每日数据更新

# 用 GitHub Actions 取代本机 launchd：每天在云端抓取 2026-27 最新赛果、重建三份报告、
# 抽取数据同步进站点，并回推仓库（GitHub Pages 随即重新部署）。
on:
  schedule:
    # 北京 06:00 ≈ UTC 22:00（前一日）。共享 runner 可能延迟 15~30 分钟，属正常。
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 允许手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write        # 回推仓库必需；默认 token 只读会 403

concurrency:
  group: football-data-daily
  cancel-in-progress: false   # 不中断正在跑的每日更新

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 含脚本内 0~60 分钟随机错峰等待 + 抓取/构建
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 git 身份（供回推提交）
        run: |
          git config user.email "bot@footballdata.local"
          git config user.name "Football Data Bot"

      - name: 运行每日更新（refresh.sh 内含抓数→重建→体检→提交→推送）
        env:
          FD_SITE_DIR: ${{ github.workspace }}
          FD_GENERATOR_DIR: ${{ github.workspace }}/generator
          FD_PY: python3
          TZ: Asia/Shanghai
        run: bash tools/refresh.sh

      # ── 小程序数据同步 ──────────────────────────────────────────────
      # 用刚刷新并提交的最新站点数据，生成移动端集合并写进微信云开发数据库，
      # 让小程序与 web 版共用同一份自动更新数据，全程无需任何手动操作。
      # 未配置云端密钥（secrets.TENCENTCLOUD_SECRET_ID 为空）时只跑「生成+导出」做体检，
      # 不写库，站点更新不受影响。
      - name: 安装云开发服务端 SDK（小程序写库用）
        working-directory: tools/mobile
        run: npm install

      - name: 生成移动端数据（读取本站最新数据）
        working-directory: tools/mobile
        run: node gen_app_data.js

      - name: 导出云开发集合
        working-directory: tools/mobile
        env:
          DEV_OPENIDS: ${{ secrets.DEV_OPENIDS }}
        run: node export_data.js

      - name: 写入云数据库（未配密钥时脚本自行跳过，保持绿灯）
        working-directory: tools/mobile
        env:
          TCB_ENV: ${{ secrets.TCB_ENV }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          DEV_OPENIDS: ${{ secrets.DEV_OPENIDS }}
        run: node seed_cloud.js
