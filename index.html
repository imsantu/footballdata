<!-- 预备绘制阶段按系统外观选画布底色，避免浅色主题刷新/跳转先闪一下深色（黑屏）。

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1117">
<!-- 首帧前定主题：主题原先由 site.js 在 body 里设置，浏览器会先按 :root 的深色变量画一帧，
     浅色主题下就表现为「刷新 / 切页闪一下黑」。这段内联脚本在 head 里同步执行，首帧之前就写好
     data-theme，闪黑从根上消失；site.js 之后会再算一次，结果一致，无副作用。 -->
<script>(function(){try{var m=null,k=['qzl_theme','fbg_theme'];for(var i=0;i<k.length;i++){try{m=localStorage.getItem(k[i]);}catch(e){}if(m)break;}if(m!=='auto'&&m!=='light'&&m!=='dark')m='auto';var t=m;if(m==='auto'){var hh=new Date().getHours();t=(hh>=6&&hh<18)?'light':'dark';if(window.matchMedia){if(matchMedia('(prefers-color-scheme: dark)').matches)t='dark';else if(matchMedia('(prefers-color-scheme: light)').matches)t='light';}}var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',t==='dark'?'#0f1117':'#eef1f6');}catch(e){}})();</script>
