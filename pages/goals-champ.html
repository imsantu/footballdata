#bootVeil{position:fixed;inset:0;z-index:150;background:var(--bg,#0f1117);pointer-events:none;overflow:hidden;}

[data-theme="light"] #bootVeil{background:#eef1f6;}

.bv-sh{position:relative;overflow:hidden;border-radius:9px;background:var(--card2,#252836);}
[data-theme="light"] .bv-sh{background:#e3e8f0;}
.bv-sh::after{content:"";position:absolute;inset:0;transform:translateX(-100%);

  animation:bvShim 1.3s infinite;}
[data-theme="light"] .bv-sh::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.045),transparent);}
@keyframes bvShim{to{transform:translateX(100%);}}
.bv-t{width:200px;height:20px;margin-bottom:18px;}
