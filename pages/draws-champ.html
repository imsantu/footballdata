<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f4f6fa">
<!-- 移动端固定浅色：手机端直接把主题钉成 light，不读 localStorage / 不读系统外观，
     杜绝任何深色闪现。桌面端仍由 site.js 的三态主题接管。 -->
<script>(function(){try{var mb=!window.matchMedia||!matchMedia('(min-width:820px)').matches;if(mb){var r=document.documentElement;r.setAttribute('data-theme','light');r.style.colorScheme='light';return;}var m=null,k=['qzl_theme','fbg_theme'];for(var i=0;i<k.length;i++){try{m=localStorage.getItem(k[i]);}catch(e){}if(m)break;}if(m!=='auto'&&m!=='light'&&m!=='dark')m='auto';var t=m;if(m==='auto'){var hh=new Date().getHours();t=(hh>=6&&hh<18)?'light':'dark';if(window.matchMedia){if(matchMedia('(prefers-color-scheme: dark)').matches)t='dark';else if(matchMedia('(prefers-color-scheme: light)').matches)t='light';}}var r=document.documentElement;r.setAttribute('data-theme',t);r.style.colorScheme=t;}catch(e){}})();</script>
<meta name="description" content="叕中啦 · 五大次级联赛（英冠/西乙/德乙/法乙/意乙）近五赛季平局数据专题：平局率、比分分布、各轮走势与各队平局统计。">

<style id="bootCss">
/* 遮罩首帧就是不透明的页面底色（与页面背景同色，所以看不出「多了一层」）；
   骨架块延迟 0.25s 才淡入 —— 加载快的页面根本看不到骨架，也就不会「闪一下」。 */
#bootVeil{position:fixed;inset:0;z-index:150;background:var(--bg,#0f1117);pointer-events:none;overflow:hidden;}
#bootVeil .bv-wrap{opacity:0;animation:bvIn .22s ease .25s forwards;}
@keyframes bvIn{to{opacity:1;}}
#bootVeil.out{animation:bvOut .28s ease forwards;}
@keyframes bvOut{from{opacity:1;}to{opacity:0;}}
[data-theme="light"] #bootVeil{background:#eef1f6;}
.bv-wrap{position:absolute;top:calc(var(--site-top-h,64px) + 22px);left:0;right:0;
  margin:0 auto;max-width:1180px;padding:0 22px;}
.bv-sh{position:relative;overflow:hidden;border-radius:9px;background:var(--card2,#252836);}
[data-theme="light"] .bv-sh{background:#e3e8f0;}
.bv-sh::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  animation:bvShim 1.3s infinite;}
[data-theme="light"] .bv-sh::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.045),transparent);}
@keyframes bvShim{to{transform:translateX(100%);}}
.bv-t{width:200px;height:20px;margin-bottom:18px;}
.bv-g{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.bv-g>.bv-sh{flex:1 1 200px;height:92px;}
.bv-card{height:216px;margin-bottom:14px;}
.bv-l{height:12px;margin-bottom:9px;border-radius:6px;}
.bv-l.w7{width:74%;} .bv-l.w6{width:58%;}
@media (max-width:820px){.bv-wrap{padding:0 14px;}.bv-t{width:140px;}.bv-card{height:170px;}
  .bv-g>.bv-sh{flex:1 1 140px;height:80px;}}
@media (prefers-reduced-motion:reduce){#bootVeil{animation-duration:.01s;}.bv-sh::after{animation:none;}}
</style>
</head>
